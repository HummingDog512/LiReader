<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LiReader PDF</title>
  <style>
    body { margin: 0; color: #111; background: #fff; }
    #lr-printbar {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: #C3C4D6;
      font: 14px system-ui, sans-serif;
    }
    #lr-printbtn {
      border: 0; border-radius: 6px; padding: 6px 12px;
      background: #1f6feb; color: #fff; font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #lr-status { color: #333; }
    @media print { #lr-printbar { display: none !important; } }
  </style>
</head>
<body>
  <div id="lr-printbar">
    <button id="lr-printbtn" type="button">Save as PDF</button>
    <span id="lr-status">Preparing the document…</span>
  </div>
  <script src="print.js"></script>
</body>
</html>
